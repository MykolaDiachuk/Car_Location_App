# Quickstart: docker compose up
#
# Required: .env in this directory with CAMERA_URL set.
# Data: SQLite history persists in ./data/ on the host.
# Logs: docker compose logs -f
# Stop: docker compose down

services:
  parking-monitor:
    build: .
    container_name: parking-monitor
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Pin the in-container DB path to the bind-mount at /data so history
      # persists across redeploys. Overrides the project-relative default
      # used for bare-metal deployments.
      DB_PATH: /data/parking_history.db
    volumes:
      - ./data:/data
    restart: unless-stopped
