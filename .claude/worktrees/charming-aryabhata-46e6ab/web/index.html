<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parking Monitor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f13;
      color: #e8e8e8;
      min-height: 100vh;
    }

    /* ── Stats bar ── */
    #stats {
      display: flex;
      align-items: center;
      gap: 2rem;
      padding: 0.75rem 1.5rem;
      background: #1a1a22;
      border-bottom: 1px solid #2a2a36;
      flex-wrap: wrap;
    }

    #stats h1 {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #888;
      flex: 1 1 auto;
    }

    .stat { text-align: center; min-width: 60px; }
    .stat .value { font-size: 1.8rem; font-weight: 700; line-height: 1; }
    .stat .label { font-size: 0.65rem; text-transform: uppercase; color: #666; margin-top: 2px; }

    #stat-occupied .value { color: #f04040; }
    #stat-free     .value { color: #30d060; }
    #stat-pct      .value { color: #f0a020; }
    #stat-total    .value { color: #aaa; }

    #status-pill {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      background: #2a2a36;
      color: #666;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    #status-pill.live    { background: #0d2e18; color: #30d060; }
    #status-pill.error   { background: #2e0d0d; color: #f04040; }

    /* ── Map area ── */
    #map-wrap {
      max-width: 1200px;
      margin: 1.5rem auto;
      padding: 0 1rem;
    }

    #map-container {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 2;   /* matches BEV 1200×800 */
      background: #1a1a2e;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      overflow: hidden;
    }

    #svg-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.5rem;
      color: #333;
      font-size: 0.85rem;
      text-align: center;
      line-height: 1.6;
      pointer-events: none;
    }
    #svg-placeholder .icon { font-size: 2rem; }

    #svg-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;    /* shown by app.js after successful fetch */
    }
    #svg-layer svg {
      width: 100%;
      height: 100%;
    }

    #dot-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="stats">
    <h1>Parking Monitor</h1>

    <div class="stat" id="stat-total">
      <div class="value" id="val-total">—</div>
      <div class="label">Total</div>
    </div>
    <div class="stat" id="stat-occupied">
      <div class="value" id="val-occupied">—</div>
      <div class="label">Occupied</div>
    </div>
    <div class="stat" id="stat-free">
      <div class="value" id="val-free">—</div>
      <div class="label">Free</div>
    </div>
    <div class="stat" id="stat-pct">
      <div class="value" id="val-pct">—</div>
      <div class="label">Occupancy</div>
    </div>

    <span id="status-pill">connecting</span>
  </div>

  <div id="map-wrap">
    <div id="map-container">

      <div id="svg-placeholder">
        <span class="icon">&#128663;</span>
        No parking map yet — place <code>assets/parking_map.svg</code><br>
        Spot indicators will appear once data loads.
      </div>

      <!-- SVG background map (injected inline by app.js) -->
      <div id="svg-layer"></div>

      <!-- Spot overlay — same viewBox as BEV canvas -->
      <svg id="dot-layer"
           xmlns="http://www.w3.org/2000/svg"
           viewBox="0 0 1200 800"
           preserveAspectRatio="xMidYMid meet">
      </svg>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
