<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Monitor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f13;
      color: #e8e8e8;
      min-height: 100vh;
      padding: 1rem;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 1rem;
      text-align: center;
    }

    .server-name {
      color: #60a0ff;
      font-size: 1.3rem;
      text-transform: none;
      letter-spacing: normal;
    }

    /* ── Grid layout ── */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 1rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background: #1a1a22;
      border: 1px solid #2a2a36;
      border-radius: 8px;
      padding: 1rem 1.2rem;
    }

    .card h2 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      color: #666;
      letter-spacing: 0.08em;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid #2a2a36;
      padding-bottom: 0.4rem;
    }

    /* ── Metric rows ── */
    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.3rem 0;
    }

    .metric-label {
      font-size: 0.8rem;
      color: #999;
    }

    .metric-value {
      font-size: 0.9rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* ── Progress bar ── */
    .bar-container {
      width: 100%;
      margin-top: 0.3rem;
    }

    .bar-bg {
      width: 100%;
      height: 8px;
      background: #2a2a36;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    .bar-fill.green { background: #30d060; }
    .bar-fill.yellow { background: #f0a020; }
    .bar-fill.red { background: #f04040; }
    .bar-fill.blue { background: #4090f0; }

    /* ── Chart ── */
    .chart-container {
      width: 100%;
      height: 120px;
      position: relative;
      margin-top: 0.5rem;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* ── Per-core grid ── */
    .cores-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 0.4rem;
      margin-top: 0.5rem;
    }

    .core-item {
      text-align: center;
      background: #22222c;
      border-radius: 4px;
      padding: 0.3rem 0.2rem;
    }

    .core-item .core-id {
      font-size: 0.6rem;
      color: #666;
    }

    .core-item .core-val {
      font-size: 0.8rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* ── Status footer ── */
    .status-bar {
      text-align: center;
      font-size: 0.7rem;
      color: #555;
      margin-top: 1rem;
    }

    .status-bar .ok { color: #30d060; }
    .status-bar .err { color: #f04040; }

    /* ── Uptime display ── */
    .uptime {
      font-size: 1rem;
      font-weight: 700;
      color: #60a0ff;
      text-align: center;
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>
  <h1>Server Monitor — <span class="server-name" id="hostname">...</span></h1>

  <div class="dashboard">
    <!-- Server info -->
    <div class="card" id="card-info">
      <h2>Server Info</h2>
      <div class="metric-row"><span class="metric-label">OS</span><span class="metric-value" id="info-os">—</span></div>
      <div class="metric-row"><span class="metric-label">Architecture</span><span class="metric-value" id="info-arch">—</span></div>
      <div class="metric-row"><span class="metric-label">Python</span><span class="metric-value" id="info-python">—</span></div>
      <div class="metric-row"><span class="metric-label">CPU Cores (phys / logical)</span><span class="metric-value" id="info-cores">—</span></div>
      <div class="metric-row"><span class="metric-label">Total RAM</span><span class="metric-value" id="info-ram">—</span></div>
      <div class="metric-row"><span class="metric-label">Uptime</span><span class="metric-value uptime" id="info-uptime">—</span></div>
    </div>

    <!-- CPU -->
    <div class="card">
      <h2>CPU Usage</h2>
      <div class="metric-row">
        <span class="metric-label">Total</span>
        <span class="metric-value" id="cpu-total">—</span>
      </div>
      <div class="bar-container"><div class="bar-bg"><div class="bar-fill green" id="cpu-bar" style="width:0%"></div></div></div>
      <div class="metric-row"><span class="metric-label">Load avg (1/5/15)</span><span class="metric-value" id="cpu-load">—</span></div>
      <div class="chart-container"><canvas id="chart-cpu"></canvas></div>
      <div class="cores-grid" id="cores-grid"></div>
    </div>

    <!-- RAM -->
    <div class="card">
      <h2>Memory (RAM)</h2>
      <div class="metric-row">
        <span class="metric-label">Used / Total</span>
        <span class="metric-value" id="ram-usage">—</span>
      </div>
      <div class="bar-container"><div class="bar-bg"><div class="bar-fill blue" id="ram-bar" style="width:0%"></div></div></div>
      <div class="metric-row"><span class="metric-label">Swap</span><span class="metric-value" id="ram-swap">—</span></div>
      <div class="chart-container"><canvas id="chart-ram"></canvas></div>
    </div>

    <!-- Disk -->
    <div class="card">
      <h2>Disk</h2>
      <div class="metric-row">
        <span class="metric-label">Used / Total</span>
        <span class="metric-value" id="disk-usage">—</span>
      </div>
      <div class="bar-container"><div class="bar-bg"><div class="bar-fill yellow" id="disk-bar" style="width:0%"></div></div></div>
    </div>

    <!-- Network -->
    <div class="card">
      <h2>Network I/O</h2>
      <div class="metric-row"><span class="metric-label">Sent (total)</span><span class="metric-value" id="net-sent">—</span></div>
      <div class="metric-row"><span class="metric-label">Received (total)</span><span class="metric-value" id="net-recv">—</span></div>
    </div>

    <!-- Temperature -->
    <div class="card" id="card-temp">
      <h2>Temperature</h2>
      <div class="metric-row"><span class="metric-label">CPU</span><span class="metric-value" id="temp-cpu">—</span></div>
    </div>
  </div>

  <div class="status-bar">
    <span id="status-text">Connecting...</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
